<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="100%" stop-color="#05020a"/>
    </linearGradient>
    
    <!-- Bubble 1 Gradient (Left/Top - English "A") -->
    <linearGradient id="bubbleEng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    
    <!-- Bubble 2 Gradient (Right/Bottom - Chinese "文") -->
    <linearGradient id="bubbleChi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Premium Rounded Icon Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border glow -->
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Left Bubble: English 'A' -->
  <g filter="url(#shadow)">
    <path d="M 28 36 C 28 27.16 35.16 20 44 20 L 72 20 C 80.84 20 88 27.16 88 36 L 88 64 C 88 72.84 80.84 80 72 80 L 44 80 C 35.16 80 28 72.84 28 64 Z" fill="url(#bubbleEng)" opacity="0.9"/>
    <!-- English Letter 'A' -->
    <path d="M 58 38 L 58 62 M 58 38 L 47 62 M 58 38 L 69 62 M 51 52 L 65 52" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Right Bubble: Chinese '文' (overlapping slightly and glassmorphic) -->
  <g filter="url(#shadow)">
    <path d="M 40 64 C 40 55.16 47.16 48 56 48 L 84 48 C 92.84 48 100 55.16 100 64 L 100 92 C 100 100.84 92.84 108 84 108 L 56 108 C 47.16 108 40 100.84 40 92 Z" fill="url(#bubbleChi)" opacity="0.9"/>
    <!-- Chinese Character '文' -->
    <path d="M 56 60 L 84 60 M 70 56 L 70 66 C 70 76 60 88 52 92 M 64 74 C 70 80 78 88 88 92" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
