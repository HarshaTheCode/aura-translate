<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AuraTranslate Icon Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1c1c1e;
      color: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      max-width: 500px;
      background: #2c2c2e;
      padding: 32px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
    }
    h2 {
      font-weight: 600;
      margin-bottom: 12px;
    }
    p {
      color: #86868b;
      font-size: 13.5px;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    button {
      background: #0a84ff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s;
    }
    button:hover {
      background: #2997ff;
    }
    .status {
      margin-top: 20px;
      font-size: 13px;
      color: #30d158;
      display: none;
      padding: 10px;
      background: rgba(48, 209, 88, 0.1);
      border: 1px solid rgba(48, 209, 88, 0.2);
      border-radius: 6px;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>AuraTranslate PNG Converter</h2>
    <p>
      Chrome requires PNG icons for its extension manager. Click below to generate the 4 required icons (16px, 32px, 48px, 128px) from <b>icon.svg</b>.
    </p>
    <button id="convertBtn">Generate & Download PNG Icons</button>
    <div id="status" class="status"></div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    document.getElementById('convertBtn').addEventListener('click', () => {
      const sizes = [16, 32, 48, 128];
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();
      
      img.onload = () => {
        sizes.forEach(size => {
          canvas.width = size;
          canvas.height = size;
          ctx.clearRect(0, 0, size, size);
          ctx.drawImage(img, 0, 0, size, size);
          
          // Download Link
          const link = document.createElement('a');
          link.download = `icon${size}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        });
        
        const status = document.getElementById('status');
        status.innerHTML = "<strong>Success!</strong> All 4 icons (icon16.png, icon32.png, icon48.png, icon128.png) downloaded. Move them from your downloads folder into the extension folder!";
        status.style.display = 'block';
      };
      
      // Load svg
      img.src = 'icon.svg';
    });
  </script>
</body>
</html>
