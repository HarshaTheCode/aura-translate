<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraTranslate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <img src="icon.svg" alt="AuraTranslate Logo" class="logo">
        <div class="title-group">
          <h1>AuraTranslate</h1>
          <span class="badge">Active</span>
        </div>
      </div>
      <div class="power-btn-wrapper">
        <button id="powerBtn" class="power-btn" title="Toggle Translation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.0">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Hero Card (Status info) -->
    <div class="status-card" id="statusCard">
      <div class="status-indicator">
        <span class="pulse-dot"></span>
        <span id="statusText">Active & Ready</span>
      </div>
      <p id="statusDesc">Ready to translate this page</p>
    </div>

    <!-- Main Settings -->
    <div class="section">
      <div class="section-title">Language Preferences</div>
      <div class="language-selector">
        <div class="select-wrapper">
          <label>From</label>
          <select id="sourceLang">
            <option value="auto" selected>Detect Language</option>
            <option value="zh-CN">Chinese (Simplified)</option>
            <option value="zh-TW">Chinese (Traditional)</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="en">English</option>
          </select>
        </div>
        
        <div class="swap-icon" id="swapLangs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 10H3M3 10L7 6M3 10L7 14M7 14H21M21 14L17 18M21 14L17 10"/>
          </svg>
        </div>

        <div class="select-wrapper">
          <label>To</label>
          <select id="targetLang">
            <option value="en" selected>English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="zh-CN">Chinese</option>
            <option value="ja">Japanese</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Options Toggles -->
    <div class="section">
      <div class="section-title">Translation Mode</div>
      
      <!-- Option 1: Auto Translate -->
      <div class="setting-row">
        <div class="setting-info">
          <div class="setting-label">Auto-Translate Site</div>
          <div class="setting-desc">Automatically translate on page load</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="autoTranslate">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Option 2: Hover to see original -->
      <div class="setting-row">
        <div class="setting-info">
          <div class="setting-label">Hover for Original</div>
          <div class="setting-desc">Hover translated text to see Chinese</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="hoverOriginal" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Statistics -->
    <div class="section stats-grid">
      <div class="stat-box">
        <div class="stat-val" id="statTranslated">0</div>
        <div class="stat-lbl">Translated</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="statCached">0</div>
        <div class="stat-lbl">Cached Phrases</div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-footer">
      <button id="translateBtn" class="btn primary-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.0" class="btn-icon">
          <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Translate Page
      </button>
      
      <button id="resetBtn" class="btn secondary-btn" title="Reset Translation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.0" class="btn-icon">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Restore Original
      </button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
